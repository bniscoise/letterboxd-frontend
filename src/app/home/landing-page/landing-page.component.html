<div class="mx-auto max-w-2xl py-16 text-center">
  <h1 class="mb-4 text-4xl font-bold text-monokai-green">Bienvenue sur Movieboxd</h1>
  <p class="mb-8 text-monokai-muted">
    Suivez vos films, notez-les et découvrez les tendances de la communauté.
  </p>

  <div class="flex items-center justify-center gap-4">
    <button
      type="button"
      class="rounded-lg bg-monokai-accent px-6 py-2 font-semibold text-monokai-background transition hover:bg-monokai-yellow"
      (click)="openLogin()"
    >
      Se connecter
    </button>

    <button
      type="button"
      class="rounded-lg border border-monokai-border px-6 py-2 font-semibold text-monokai-text transition hover:bg-monokai-surfaceHighlight"
      (click)="openRegister()"
    >
      Créer un compte
    </button>
  </div>
</div>
